<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Norsyamimi Hasran · Software Developer</title>
  <meta name="description" content="Norsyamimi Hasran: software developer in Shah Alam building payment-gateway and fintech systems with PHP, Laravel, NestJS and Vue.">
  <meta property="og:title" content="Norsyamimi Hasran · Software Developer">
  <meta property="og:description" content="Explore my workspace: payment gateways, gold-investment platforms and more.">
  <meta property="og:url" content="https://norsyamimi.my">
  <meta property="og:image" content="https://norsyamimi.my/assets/img/profile.jpg">
  <meta name="theme-color" content="#0b1730">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="viewport" id="viewport" tabindex="0" aria-label="Portfolio canvas. Drag, scroll or use arrow keys to explore.">
    <div class="world" id="world">
      <canvas class="world__bg" id="bg" aria-hidden="true"></canvas>
      <div class="world__grid" aria-hidden="true"></div>

      <!-- Hero -->
      <section class="hero" id="hero">
        <h1 class="sticker">
          <span class="sticker__name" id="heroName">SYAMIMI'S</span>
          <span class="sticker__tag" id="heroTag">workspace</span>
        </h1>
        <p class="hero__intro" id="heroIntro"></p>
        <nav class="hero__nav no-pan" aria-label="Jump to">
          <button class="pill" data-go="work">Work</button>
          <button class="pill" data-go="about">About / Contact</button>
          <button class="pill" data-open="resume">Resume</button>
        </nav>
      </section>

      <!-- Group labels + project cards are rendered from data.js -->
      <div id="items"></div>

      <!-- About note -->
      <article class="note" id="about" style="left:980px;top:300px;--r:-2.5deg">
        <img class="note__photo" src="assets/img/profile.jpg" alt="Portrait of Norsyamimi Hasran" width="96" height="96">
        <h2>About</h2>
        <div id="aboutText"></div>
        <p class="note__loc">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
          <span id="loc"></span>
        </p>
        <ul class="socials no-pan" id="socials"></ul>
      </article>

      <!-- Resume pinned paper -->
      <button class="paper no-pan" data-open="resume" style="left:1500px;top:330px;--r:3deg" aria-label="Open resume">
        <span class="pin" aria-hidden="true"></span>
        <span class="paper__sheet" aria-hidden="true">
          <b>NORSYAMIMI HASRAN</b>
          <i></i><i></i><i class="s"></i><em></em><i></i><i class="s"></i><i></i><em></em><i></i><i class="s"></i><i></i><i class="s"></i>
        </span>
        <span class="cap"><strong>Resume</strong><span>click to open</span></span>
      </button>

      <!-- Skills -->
      <article class="panel" style="left:1820px;top:280px;width:400px;--r:1.5deg">
        <h2>Skills &amp; tools</h2>
        <div id="skills"></div>
      </article>

      <!-- Experience timeline -->
      <article class="panel" style="left:2290px;top:300px;width:430px;--r:-1.5deg">
        <h2>Experience</h2>
        <ol class="tl" id="timeline"></ol>
        <button class="link no-pan" data-open="resume">Full details →</button>
      </article>

      <!-- Education -->
      <article class="panel" style="left:2790px;top:340px;width:330px;--r:2deg">
        <h2>Education</h2>
        <ul class="edu" id="education"></ul>
      </article>

      <!-- Achievement medal -->
      <div class="medal" style="left:3180px;top:330px;--r:-6deg">
        <div class="medal__ribbon" aria-hidden="true"></div>
        <div class="medal__disc"><span id="medalYear">2023</span><strong id="medalTitle">GOLD</strong></div>
        <p class="medal__cap" id="medalCap"></p>
      </div>

      <!-- Leadership -->
      <article class="note note--small" style="left:2560px;top:1990px;--r:2.5deg">
        <h2>Leadership</h2>
        <p><strong id="leadTitle"></strong><br><span id="leadOrg"></span></p>
        <ul id="leadRoles"></ul>
      </article>
    </div>
  </div>

  <!-- Sticky navigation (always visible) -->
  <nav class="topnav" aria-label="Main">
    <button class="topnav__home" data-go="home" aria-label="Home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
      <span>Home</span>
    </button>
    <button data-go="work">ToyyibPay</button>
    <button data-go="earlier">Earlier work</button>
    <button data-go="uni">Projects</button>
    <button data-go="about">About / Contact</button>
    <button class="topnav__cta" data-open="resume">Resume</button>
  </nav>

  <!-- Rulers + HUD -->
  <canvas class="ruler ruler--x" id="rulerX" aria-hidden="true"></canvas>
  <canvas class="ruler ruler--y" id="rulerY" aria-hidden="true"></canvas>
  <div class="ruler-corner" aria-hidden="true"></div>
  <div class="coord" id="coord" aria-hidden="true"></div>

  <div class="hud">
    <span class="hud__hint">drag to explore</span>
    <button class="hud__btn" id="recenter" aria-label="Back to start" title="Back to start">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <button class="hud__btn" id="zoomOut" aria-label="Zoom out" title="Zoom out">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
    </button>
    <button class="hud__btn" id="zoomIn" aria-label="Zoom in" title="Zoom in">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <!-- Project detail dialog -->
  <dialog class="modal" id="projectModal" aria-labelledby="pmTitle">
    <button class="modal__close" data-close aria-label="Close">×</button>
    <div class="modal__thumb" id="pmThumb" aria-hidden="true"></div>
    <p class="modal__meta" id="pmMeta"></p>
    <h2 id="pmTitle"></h2>
    <ul class="chips" id="pmTech"></ul>
    <ul class="modal__points" id="pmPoints"></ul>
  </dialog>

  <!-- Resume dialog -->
  <dialog class="modal modal--resume" id="resumeModal" aria-labelledby="rsName">
    <div class="modal__bar no-print">
      <button class="pill pill--light" id="printResume">Print / Save PDF</button>
      <button class="modal__close" data-close aria-label="Close">×</button>
    </div>
    <div class="resume" id="resume"></div>
  </dialog>

  <noscript>
    <p style="padding:24px;color:#fff;font-family:sans-serif">This portfolio is an interactive canvas and needs JavaScript. Norsyamimi Hasran, Software Developer, Shah Alam.</p>
  </noscript>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
